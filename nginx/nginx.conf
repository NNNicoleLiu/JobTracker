# nginx/nginx.conf

upstream django {
    server backend:8000; 
}

server {
    listen 80;
    server_name localhost 52.62.237.44 jobtracker.miagamestudio.com;

    client_max_body_size 20M;   # raise for file uploads

    # ── Gzip ────────────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json
               application/javascript text/javascript;

    # ── Security headers ─────────────────────────────────────────────────
    add_header X-Frame-Options       "SAMEORIGIN"   always;
    add_header X-Content-Type-Options "nosniff"     always;

    # ── React frontend (built static files) ─────────────────────────────
    # Nginx serves the Vite build output directly — no Node process needed
    # in production.
    location / {
        root   /usr/share/nginx/html;
        index  index.html;
        try_files $uri $uri/ /index.html;   # SPA fallback for React Router
    }
    # user Auth
    location /auth/ {
        proxy_pass         http://django;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
    # jobs
    location /jobs/ {
        proxy_pass         http://django;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
    # all-auth
    location /jobs/ {
        proxy_pass         http://django;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
    # admin
    location /admin/ {
        proxy_pass         http://django;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Django static files ───────────────────────────────────────────────
    # collectstatic output — served by Nginx, never touches Django
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ── Django media files (user uploads) ────────────────────────────────
    location /media/ {
        alias /app/mediafiles/;
        expires 7d;
    }
}