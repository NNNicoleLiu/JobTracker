upstream django {
    server backend:8000;
}

map $http_origin $origin_allowed {
    default                                    0;
    ""                                         1;
    "https://jobtracker.miagamestudio.com"     1;
    "https://www.jobtracker.miagamestudio.com" 1;
}

# ── Redirect all HTTP to HTTPS ────────────────────────────────────────────────
# Nginx handles the redirect here — Django never needs to
server {
    listen 80;
    server_name jobtracker.miagamestudio.com www.jobtracker.miagamestudio.com;
    return 301 https://$host$request_uri;    # permanent redirect to HTTPS
}

# ── Main HTTPS server ─────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name jobtracker.miagamestudio.com www.jobtracker.miagamestudio.com;

    # ── SSL certificates (from Certbot) ───────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/jobtracker.miagamestudio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jobtracker.miagamestudio.com/privkey.pem;

    client_max_body_size 20M;

    gzip on;
    gzip_types text/plain text/css application/json
               application/javascript text/javascript;

    add_header X-Frame-Options            "SAMEORIGIN"                always;
    add_header X-Content-Type-Options     "nosniff"                   always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups"  always;

    # ── Auth routes ───────────────────────────────────────────────────
    location /auth/ {
        if ($origin_allowed = 0) { return 403; }
        proxy_pass       http://django;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;    # ← sends "https" to Django
    }

    # ── Accounts routes ───────────────────────────────────────────────────
    location /accounts/ {
        if ($origin_allowed = 0) { return 403; }
        proxy_pass       http://django;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;    # ← sends "https" to Django
    }

    # ── Jobs routes ───────────────────────────────────────────────────
    location /jobs/ {
        if ($origin_allowed = 0) { return 403; }
        proxy_pass       http://django;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;    # ← sends "https" to Django
    }

    # ── Admin ─────────────────────────────────────────────────────────
    location /admin/ {
        allow your.home.ip.address;
        deny  all;
        proxy_pass       http://django;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Static files ──────────────────────────────────────────────────
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ── Media files ───────────────────────────────────────────────────
    location /media/ {
        alias /app/mediafiles/;
        expires 7d;
    }

    # ── React SPA ─────────────────────────────────────────────────────
    location / {
        root   /usr/share/nginx/html;
        index  index.html;
        try_files $uri $uri/ /index.html;
    }
}