services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: job_tracker_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - job_tracker_network

  # Django Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: job_tracker_backend
    depends_on:
      - db
    networks:
      - job_tracker_network

  frontend:
    build:
      context: ./frontend
    container_name: jobtracker_frontend

volumes:
  postgres_data:
networks:
  job_tracker_network:
    driver: bridge
