version: "3.9"

services:
  db:
    image: postgres:15
    restart: always
    env_file:
      - ./backend/.env
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    restart: always
    env_file:
      - ./backend/.env
    depends_on:
      - db

  frontend:
    build: ./frontend
    restart: always
    environment:
      - VITE_API_URL=http://52.62.237.44:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
