name: Full Stack Project CI Pipeline (E2E)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test_user"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      # Backend
      POSTGRES_DB: test_db
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      SECRET_KEY: test-secret-key
      DEBUG: False
      ALLOWED_HOSTS: localhost,127.0.0.1

      # Frontend
      VITE_API_URL: http://localhost:8000

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # -------------------------
      # 🐍 Setup Backend
      # -------------------------
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Install backend dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Run migrations
        run: |
          cd backend
          python manage.py migrate

      - name: Create test user
        run: |
          cd backend
          python manage.py shell <<EOF
          from django.contrib.auth import get_user_model
          User = get_user_model()
          User.objects.create_user(
              name="user",
              email="test@test.com",
              password="Password123!"
          )
          EOF

      - name: Start backend
        run: |
          cd backend
          python manage.py runserver 0.0.0.0:8000 &

      - name: Wait for backend
        timeout-minutes: 1
        run: |
          until curl -s http://localhost:8000; do
            sleep 2
          done

      # -------------------------
      # ⚛️ Setup Frontend
      # -------------------------
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm install

      - name: Build frontend
        run: |
          cd frontend
          npm run build

      - name: Start frontend
        run: |
          cd frontend
          npm run preview -- --host 0.0.0.0 --port 5173 &

      - name: Wait for frontend
        timeout-minutes: 1
        run: |
          until curl -s http://localhost:5173; do
            sleep 2
          done

      # -------------------------
      # 🎭 Install Playwright
      # -------------------------
      - name: Install Playwright
        run: |
          cd frontend
          npx playwright install --with-deps

      # -------------------------
      # 🚀 Run E2E Tests
      # -------------------------
      - name: Run E2E tests
        run: |
          cd frontend
          npx playwright test
